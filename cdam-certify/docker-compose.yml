version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cdam
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cdam_certify
    ports:
      - '5432:5432'
    volumes:
      - cdam_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

volumes:
  cdam_postgres_data:
